[project]
name = "aether"
version = "3.0.0"
description = "A.E.T.H.E.R. - local-first assistant for engineering, learning, and automation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "A.E.T.H.E.R. contributors" }]
keywords = ["ollama", "local-ai", "assistant", "multi-agent", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiohttp>=3.9.0",
    "ollama>=0.4.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
llm = ["torch>=2.0.0", "transformers>=4.40.0"]
vector = ["chromadb>=0.5.0"]
airllm = ["airllm>=2.0.0"]
desktop = ["PySide6>=6.6.0", "pynput>=1.7.6"]
stt = ["vosk>=0.3.45", "sounddevice>=0.4.6"]

[project.scripts]
aether = "aether.cli:main"
aether-app = "aether.desktop.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aether*", "integrations*"]

[tool.setuptools.package-data]
"aether.web" = ["static/**/*", "static/icons/*"]
